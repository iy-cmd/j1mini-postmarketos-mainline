SectionVerb {
	EnableSequence [
		cset "name='DAC Playback Volume' 7,7"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal Speaker"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='SPKL Mixer DACL Switch' on"
		cset "name='SPKL Mixer DACR Switch' on"
		cset "name='Speaker Switch' on"
		cset "name='Speaker Playback Volume' 10"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
		cset "name='SPKL Mixer DACL Switch' off"
		cset "name='SPKL Mixer DACR Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Speaker"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='HPL Mixer DACL Switch' on"
		cset "name='HPR Mixer DACR Switch' on"
		cset "name='Headphones Switch' on"
		cset "name='Headphone Playback Volume' 12,12"
	]

	DisableSequence [
		cset "name='Headphones Switch' off"
		cset "name='HPL Mixer DACL Switch' off"
		cset "name='HPR Mixer DACR Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Headphone"
		JackControl "Headphones Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='ADCL Mixer MIC Switch' on"
		cset "name='ADCR Mixer MIC Switch' on"
		cset "name='Mic Boost Volume' 2"
		cset "name='ADC Capture Volume' 24,24"
		cset "name='ADC Digital Capture Volume' 32,32"
	]

	DisableSequence [
		cset "name='ADCL Mixer MIC Switch' off"
		cset "name='ADCR Mixer MIC Switch' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureMixerElem "ADC Digital"
	}
}
