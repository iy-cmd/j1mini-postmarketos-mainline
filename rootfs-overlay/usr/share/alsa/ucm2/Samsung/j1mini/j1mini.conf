Syntax 4

SectionUseCase."HiFi" {
	File "HiFi.conf"
	Comment "Default HiFi Audio"
}

BootSequence [
	cset "name='DAC Playback Volume' 7,7"
	cset "name='Speaker Playback Volume' 10"
	cset "name='Headphone Playback Volume' 12,12"
	cset "name='SPKL Mixer DACL Switch' on"
	cset "name='SPKL Mixer DACR Switch' on"
	cset "name='Speaker Switch' on"
	cset "name='Headphones Switch' off"
	cset "name='HPL Mixer DACL Switch' off"
	cset "name='HPR Mixer DACR Switch' off"
	cset "name='Mic Boost Volume' 2"
	cset "name='ADC Capture Volume' 24,24"
	cset "name='ADC Digital Capture Volume' 32,32"
	cset "name='ADCL Mixer MIC Switch' on"
	cset "name='ADCR Mixer MIC Switch' on"
]
