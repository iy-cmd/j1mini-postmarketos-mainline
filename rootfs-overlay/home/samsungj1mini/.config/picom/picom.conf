# Minimal VSync-only compositor for Mali-400 (Lima) + sprd-dispc
# Eliminates frontbuffer tearing, blinking, and mid-tile scanout artifacts.
backend = "xrender";
vsync = true;
use-damage = false;

# Disable all eye-candy to keep Mali-400 MP1 fast and light
shadow = false;
fading = false;
corner-radius = 0;
blur-method = "none";

# Never unredirect fullscreen windows (prevents black flash when opening svkbd/dmenu)
unredir-if-possible = false;

# Keep redraws clean on Lima/Mali-400
dithered-present = false;
xrender-sync-fence = true;
