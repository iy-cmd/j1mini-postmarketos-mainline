monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 1600
        api.alsa.period-num = 4
        api.alsa.headroom = 1600
        audio.rate = 44100
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
